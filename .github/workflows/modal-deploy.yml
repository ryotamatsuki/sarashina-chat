name: Deploy Modal backend

on:
  workflow_dispatch:
    inputs:
      download_model:
        description: "Download/update model weights before deploying"
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy to Modal
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal and FastAPI
        run: |
          python -m pip install --upgrade pip
          pip install modal fastapi

      - name: Download model weights
        if: ${{ inputs.download_model }}
        run: modal run modal_backend.py::download_model

      - name: Deploy backend
        run: modal deploy modal_backend.py
